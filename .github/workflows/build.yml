name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          {
            echo "## Fehler"
            echo '~~~'
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|AAPT|Manifest merger" build.log | head -40
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
